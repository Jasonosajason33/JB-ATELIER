<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JB Flow</title>
  <meta name="description" content="JB Flow — planification de la production comptable et de la TVA">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JB Flow">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ECEBE6">
  <link rel="icon" type="image/png" href="logo-32.png"><link rel="apple-touch-icon" href="logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap">
  <script>document.documentElement.dataset.ui = "v2"; /* design V2 (thèmes Clair et Signature) */
    /* Thème choisi par l'utilisateur (préférence locale), appliqué avant l'affichage */
    try { var th = localStorage.getItem('planif-theme'); document.documentElement.dataset.theme = th === 'clair' || th === 'iris' ? 'clair' : 'signature'; if (th === 'nuit') document.documentElement.dataset.variant = 'aurora'; if (th === 'iris') document.documentElement.dataset.variant = 'iris'; var sd = localStorage.getItem('planif-side'); if ((sd === 'dark' || sd === 'color') && th !== 'iris') document.documentElement.dataset.side = sd; var ac = localStorage.getItem('planif-accent'); if (ac) document.documentElement.dataset.accent = ac; var mo = localStorage.getItem('planif-motion'); if (mo === 'reduced') document.documentElement.dataset.motion = 'reduced'; else if (mo !== 'system') document.documentElement.dataset.motion = 'always'; } catch (e) { document.documentElement.dataset.theme = 'signature'; document.documentElement.dataset.motion = 'always'; }
  </script>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="design-v2.css"><link rel="stylesheet" href="design-signature.css"><link rel="stylesheet" href="design-effects.css"><link rel="stylesheet" href="design-aurora.css"><link rel="stylesheet" href="design-clair.css"><link rel="stylesheet" href="design-iris.css"><link rel="stylesheet" href="design-motion.css"><link rel="stylesheet" href="design-planning.css">
</head>
<body>
  <div id="app"><div class="boot">Chargement…</div></div>
  <div id="sheet-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Cette application nécessite JavaScript.</noscript>
  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="fiscal.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
  <script src="ui-v2.js"></script>
</body>
</html>
